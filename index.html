<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeZone</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080810;
 color:white;
 font-family:Arial,sans-serif
}
header{
 padding:18px;
 background:#11111c;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:5
}
.logo{
 font-size:27px;
 font-weight:bold;
 color:#b56cff
}
.search{
 width:280px;
 padding:12px 18px;
 border:0;
 border-radius:25px;
 background:#252535;
 color:white;
 outline:none
}
.hero{
 padding:55px 25px;
 min-height:350px;
 background:
 linear-gradient(90deg,#080810 15%,transparent),
 linear-gradient(0deg,#080810,transparent),
 url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1600&q=80")
 center/cover
}
.hero h1{font-size:48px;margin:0 0 15px}
.hero p{max-width:550px;color:#ccc}
button{
 border:0;
 padding:13px 22px;
 border-radius:10px;
 background:#914cff;
 color:white;
 font-size:16px;
 cursor:pointer
}
section{padding:25px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:18px
}
.card{
 background:#151521;
 border-radius:15px;
 overflow:hidden;
 transition:.2s
}
.card:hover{
 transform:translateY(-6px);
 box-shadow:0 12px 30px #000
}
.poster{
 height:250px;
 background-size:cover;
 background-position:center
}
.info{padding:14px}
.info h3{margin:0 0 7px}
.info p{color:#999;font-size:13px}
.watch{
 width:100%;
 margin-top:8px
}
.rating{color:#ffd740;margin:8px 0}
@media(max-width:600px){
 header{flex-direction:column;gap:12px}
 .search{width:100%}
 .hero h1{font-size:34px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .poster{height:220px}
}
</style>
</head>

<body>

<header>
<div class="logo">⚡ AnimeZone</div>

<input
 id="search"
 class="search"
 placeholder="🔎 Поиск аниме..."
 oninput="searchAnime()">
</header>

<div class="hero">
<h1>Смотри любимое аниме</h1>
<p>
Находи сериалы, выбирай аниме и переходи
к официальному просмотру.
</p>

<button onclick="scrollToAnime()">🔥 Смотреть аниме</button>
</div>

<section id="anime">
<h2>🔥 Популярное</h2>

<div class="grid">

<div class="card" data-name="Jujutsu Kaisen">
<div class="poster" style="background-image:url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80')"></div>
<div class="info">
<h3>Jujutsu Kaisen</h3>
<p>Экшен • Фэнтези</p>
<div class="rating">⭐ 9.0</div>
<button class="watch"
onclick="watchAnime('https://www.crunchyroll.com/series/G6QWD3EE6/jujutsu-kaisen')">
▶ Смотреть официально
</button>
</div>
</div>

<div class="card" data-name="One Piece">
<div class="poster" style="background-image:url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80')"></div>
<div class="info">
<h3>One Piece</h3>
<p>Приключения • Фэнтези</p>
<div class="rating">⭐ 9.2</div>
<button class="watch"
onclick="watchAnime('https://www.crunchyroll.com/series/GRMG8ZQZR/one-piece')">
▶ Смотреть официально
</button>
</div>
</div>

<div class="card" data-name="Demon Slayer">
<div class="poster" style="background-image:url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80')"></div>
<div class="info">
<h3>Demon Slayer</h3>
<p>Экшен • Фэнтези</p>
<div class="rating">⭐ 8.9</div>
<button class="watch"
onclick="watchAnime('https://www.crunchyroll.com/series/G6NQ5DWZ6/demon-slayer-kimetsu-no-yaiba')">
▶ Смотреть официально
</button>
</div>
</div>

<div class="card" data-name="Naruto">
<div class="poster" style="background-image:url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80')"></div>
<div class="info">
<h3>Naruto</h3>
<p>Экшен • Приключения</p>
<div class="rating">⭐ 8.8</div>
<button class="watch"
onclick="watchAnime('https://www.crunchyroll.com/search?q=Naruto')">
▶ Смотреть официально
</button>
</div>
</div>

</div>
</section>

<script>

function watchAnime(url){
 window.open(url,"_blank");
}

function scrollToAnime(){
 document.getElementById("anime")
 .scrollIntoView({behavior:"smooth"});
}

function searchAnime(){

 let value=document
 .getElementById("search")
 .value
 .toLowerCase();

 document.querySelectorAll(".card")
 .forEach(card=>{

   let name=card.dataset.name.toLowerCase();

   card.style.display=
   name.includes(value) ? "block" : "none";

 });
}

</script>

</body>
  </html>
